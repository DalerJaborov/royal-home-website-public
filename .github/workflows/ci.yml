name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reject private or mixed Git ancestry
        run: test "$(git rev-list --max-parents=0 HEAD)" = '20f1cfe6711fc3572fc1c962e9d81d3cdc08e94d'
      - name: Scan public Git history for secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$RUNNER_TEMP/gitleaks"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | (cd "$RUNNER_TEMP/gitleaks" && sha256sum --check)
          tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts=--all --redact --no-banner
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test -- --maxWorkers=4
      - run: npm run build
