    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      body { font-family: 'Inter', 'Inter Fallback', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; }

      /* Brand-dark-green splash (back by request) — soft gold glow behind
         the logo instead of a card/border, so it still reads as glass lit
         from within rather than a flat block of color. */
      #pwa-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: none;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #1a4d3a;
      }
      #pwa-splash::before,
      #pwa-splash::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        pointer-events: none;
      }
      #pwa-splash::before {
        width: 60vw;
        height: 60vw;
        max-width: 420px;
        max-height: 420px;
        background: radial-gradient(circle, rgba(246, 196, 83, 0.28), transparent 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -55%);
      }
      #pwa-splash::after {
        width: 90vw;
        height: 90vw;
        max-width: 640px;
        max-height: 640px;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.06), transparent 72%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: -1;
      }
      #pwa-splash .pwa-splash-glass {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      #pwa-splash img {
        width: 26vw;
        max-width: 120px;
        min-width: 76px;
        filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.35));
        animation: pwaSplashPulse 1.1s ease-in-out infinite;
      }
      #pwa-splash .pwa-splash-title {
        font-family: 'Inter', 'Inter Fallback', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.16em;
        text-align: center;
        color: #ffffff;
        animation: pwaSplashPulse 1.1s ease-in-out infinite;
      }
      #pwa-splash.pwa-splash-hide {
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
      @keyframes pwaSplashPulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.88; }
      }
    </style>
  </head>
  <body>
    <!-- Shown only when launched as an installed PWA (standalone display
         mode) -- a brief animated-logo splash while the app boots, so
         launching feels like opening a native app instead of a browser tab.
         Regular website visits skip this entirely. -->
    <div id="pwa-splash">
      <div class="pwa-splash-glass">
        <img alt="" />
        <div class="pwa-splash-title">ROYAL HOME</div>
      </div>
    </div>
    <div id="root"></div>
    <!-- Логика сплэша — в отдельном файле, не инлайном: CSP (script-src 'self'
         без хэшей) блокировал инлайновый скрипт, и сплэш не работал вовсе. -->
    <script src="/pwa-splash.js" defer></script>
    <script type="module" src="/src/entry-client.ts"></script>

    <!-- The local loader requests Telegram's SDK only inside a Mini App. -->
    <script src="/telegram-webapp-loader.js" defer></script>

    <!-- Яндекс.Метрика — тот же паттерн «отдельный файл вместо инлайна» из-за CSP. -->
    <script src="/metrika-loader.js" defer></script>
  </body>
